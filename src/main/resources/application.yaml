spring:
  application:
    name: rupixo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rupixoDB}
    username: ${DB_USER:}
    password: ${DB_PASS:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    title: Rupixo API Documentation
    description: This is the API documentation for the Rupixo application.
    version: OPENAPI_3_1
    path: /rupixo-api-docs

vault:
  master-key: wuiey98y398yh3dun3dh2yd7ncy23fy723yd3ny2343

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80
jwt:
  secret-key: ${JWT_SECRET:dont-use-this-secret-in-production-ncw3e80hc389013hehurdhw09}
  expiration: ${JWT_EXPIRATION:3600000} # 1 hour in milliseconds